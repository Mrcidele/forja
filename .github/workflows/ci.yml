name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Qualidade e testes (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Estilo (Pint, PSR-12)
        run: composer lint

      - name: Rector (dry-run)
        run: composer refactor:check

      - name: PHPStan (nível max)
        run: composer analyse

      - name: Testes (Pest)
        run: composer test

  apps:
    name: ${{ matrix.app }} com o framework local
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [skeleton, examples/tasks]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Apontar forja/framework para o código deste repositório
        if: matrix.app == 'skeleton'
        run: composer config repositories.framework '{"type": "path", "url": "..", "options": {"symlink": true, "versions": {"forja/framework": "0.1.0"}}}'

      - name: Instalar dependências
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Testes (Pest)
        run: vendor/bin/pest

      - name: Console
        run: php forja list
