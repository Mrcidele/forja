; OPcache para produção. Rode "php forja optimize" a cada deploy para gerar
; var/cache/preload.php e os caches de configuração, rotas e container.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Sem verificação de timestamps: reinicie o PHP a cada deploy.
opcache.validate_timestamps=0
opcache.preload=/app/var/cache/preload.php
opcache.preload_user=www-data
opcache.jit=tracing
opcache.jit_buffer_size=64M
